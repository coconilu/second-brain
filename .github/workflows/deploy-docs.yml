name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-docs.yml"
      - "docs/.vitepress/config.ts"
  workflow_dispatch:

concurrency:
  group: docs-pages-production
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # update-docs-index.mjs needs full git history for first-added dates

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh docs index and timeline
        run: pnpm docs:update-index

      - name: Commit index refresh
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/index.md docs/timeline.md; then
            echo "Index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.md docs/timeline.md
          git commit -m "docs: refresh index and timeline [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Build VitePress site
        run: pnpm docs:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
