# =============================================================================
# manifest.yaml  —— 控制哪些内容被打包到各个平台
#
# 用法：
#   skills 下注册技能，sub_agents 下注册 sub-agent，commands 下注册 command
#   platforms 可选值: opencode, claudecode（可单选或多选）
#
# 示例：
#   skills:
#     - name: refactor-code
#       platforms: [opencode, claudecode]
#   sub_agents:
#     - name: code-reviewer
#       platforms: [claudecode]
#   commands:
#     - name: review-gen
#       platforms: [opencode, claudecode]
# =============================================================================

skills:
  - name: scan-reviewer
    platforms: [opencode, claudecode]

sub_agents:
  - name: component-scanner
    platforms: [opencode, claudecode]
  - name: post-generate-reviewer
    platforms: [opencode, claudecode]

commands:
  - name: scan-index
    platforms: [opencode, claudecode]
  - name: review-gen
    platforms: [opencode, claudecode]
