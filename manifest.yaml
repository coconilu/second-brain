# =============================================================================
# manifest.yaml  —— 控制哪些内容被打包到各个平台
#
# 用法：
#   skills 下注册技能，sub_agents 下注册 sub-agent，commands 下注册 command
#   platforms 可选值: opencode, claudecode（可单选或多选）
#
# 示例：
#   skills:
#     - name: refactor-code
#       platforms: [opencode, claudecode]
#   sub_agents:
#     - name: code-reviewer
#       platforms: [claudecode]
#   commands:
#     - name: review-gen
#       platforms: [opencode, claudecode]
#
# 当前没有任何注册项：原有的 skills/ 与 sub-agent/ 已清理，
# 跨平台（Kimi Code / Codex）共用的 skill 直接放在 .agents/skills/ 下，
# 不经过本清单打包。
# =============================================================================

skills: []

sub_agents: []

commands: []
